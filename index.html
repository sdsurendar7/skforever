<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kavvu ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffebee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        h1 {
            color: #d32f2f;
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
            left: 160px; /* Adjust based on your button size */
        }

        .gif-container {
            margin-bottom: 20px;
        }

        img {
            width: 200px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container">
            <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjV0NmJrcDUxYTY3bGM3M3J1cWljYWYydTdqZjR4MzcxbnN1M2JiZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/yezzIIxFRnvZC11RXk/giphy.gif" alt="Cute Cat">
        </div>
        <h1>Will you be my Valentine, Kavvu? ❤️</h1>
        
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes!</button>
            <button id="noBtn" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function celebrate() {
    // 1. Change the page content
    document.body.innerHTML = `
        <div class="container">
            <img src="us.jpg" alt="Us" style="width:300px; border-radius: 20px;">
            <p style="font-size: 1.5rem; color: #d32f2f; margin-top: 20px;">Hence proved. I am your Boyfriend!❤️</p>
        </div>
    `;
    document.body.style.backgroundColor = "#ffcdd2";

    // 2. Fire Confetti from the corners
    var duration = 5 * 1000; // How long the confetti lasts (5 seconds)
    var animationEnd = Date.now() + duration;
    var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    var interval = setInterval(function() {
      var timeLeft = animationEnd - Date.now();

      if (timeLeft <= 0) {
        return clearInterval(interval);
      }

      var particleCount = 50 * (timeLeft / duration);
      
      // Fire from left corner
      confetti(Object.assign({}, defaults, { 
        particleCount, 
        origin: { x: 0, y: 0.7 },
        colors: ['#ff0000', '#ff69b4', '#ffffff'] // Red, Pink, White
      }));
      
      // Fire from right corner
      confetti(Object.assign({}, defaults, { 
        particleCount, 
        origin: { x: 1, y: 0.7 },
        colors: ['#ff0000', '#ff69b4', '#ffffff']
      }));
    }, 250);
}
    </script>
</body>

</html>
